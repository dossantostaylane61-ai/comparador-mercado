<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Cestôu - Comparador & Lista de Compras</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .bg-gradient-custom {
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-12">

  <!-- Header / Navbar -->
  <header class="bg-gradient-custom text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-white/20 p-2 rounded-xl backdrop-blur-md">
          <i class="fa-solid me-shopping-basket text-2xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold leading-tight">Meu Cestôu</h1>
          <p class="text-xs text-emerald-100">Economize no supermercado</p>
        </div>
      </div>
      <button onclick="limparTudo()" class="text-xs bg-emerald-700/50 hover:bg-emerald-700 px-3 py-1.5 rounded-lg border border-emerald-400/30 transition">
        <i class="fa-solid fa-trash-can mr-1"></i> Limpar Tudo
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">

    <!-- Card 1: Adicionar Produtos e Preços -->
    <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80">
      <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center">
        <i class="fa-solid fa-plus-circle text-emerald-600 mr-2"></i> Adicionar Item à Lista
      </h2>
      <form id="productForm" class="grid grid-cols-1 md:grid-cols-4 gap-3">
        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-slate-500 mb-1">Nome do Produto</label>
          <input type="text" id="itemName" placeholder="Ex: Arroz 5kg, Leite, Café" required
            class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Preço Mercado A (R$)</label>
          <input type="number" step="0.01" id="priceA" placeholder="0.00" required
            class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Preço Mercado B (R$)</label>
          <input type="number" step="0.01" id="priceB" placeholder="0.00" required
            class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none text-sm">
        </div>
        <div class="md:col-span-4 mt-2">
          <button type="submit"
            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl shadow-md transition flex items-center justify-center space-x-2">
            <i class="fa-solid fa-plus"></i>
            <span>Adicionar Produto</span>
          </button>
        </div>
      </form>
    </section>

    <!-- Card 2: Comparativo / Resumo da Economia -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
        <span class="text-xs font-medium text-slate-500 uppercase tracking-wider">Total Mercado A</span>
        <div class="text-2xl font-bold text-slate-800 mt-1" id="totalA">R$ 0,00</div>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
        <span class="text-xs font-medium text-slate-500 uppercase tracking-wider">Total Mercado B</span>
        <div class="text-2xl font-bold text-slate-800 mt-1" id="totalB">R$ 0,00</div>
      </div>
      <div class="bg-emerald-50 p-4 rounded-2xl shadow-sm border border-emerald-200 flex flex-col justify-between">
        <span class="text-xs font-medium text-emerald-700 uppercase tracking-wider">Melhor Combinação / Economia</span>
        <div class="text-2xl font-bold text-emerald-600 mt-1" id="bestTotal">R$ 0,00</div>
        <span class="text-xs text-emerald-600 mt-1" id="savingsText">Você economiza R$ 0,00 comprando os itens mais baratos de cada um.</span>
      </div>
    </section>

    <!-- Card 3: Tabela de Itens Cadastrados -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center">
        <h3 class="font-bold text-slate-700 flex items-center">
          <i class="fa-solid fa-list-check text-emerald-600 mr-2"></i> Lista de Produtos (<span id="itemCount">0</span>)
        </h3>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-slate-50 text-slate-500 uppercase text-xs">
              <th class="py-3 px-4 font-semibold">Produto</th>
              <th class="py-3 px-4 font-semibold">Mercado A</th>
              <th class="py-3 px-4 font-semibold">Mercado B</th>
              <th class="py-3 px-4 font-semibold">Onde Comprar</th>
              <th class="py-3 px-4 font-semibold text-right">Ações</th>
            </tr>
          </thead>
          <tbody id="productList" class="divide-y divide-slate-100">
            <!-- Os itens serão inseridos aqui via JavaScript -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    let products = JSON.parse(localStorage.getItem('cestou_items')) || [];

    const form = document.getElementById('productForm');
    const productList = document.getElementById('productList');

    function saveAndRender() {
      localStorage.setItem('cestou_items', JSON.stringify(products));
      render();
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('itemName').value;
      const priceA = parseFloat(document.getElementById('priceA').value);
      const priceB = parseFloat(document.getElementById('priceB').value);

      products.push({ id: Date.now(), name, priceA, priceB });
      form.reset();
      document.getElementById('itemName').focus();
      saveAndRender();
    });

    function deleteItem(id) {
      products = products.filter(p => p.id !== id);
      saveAndRender();
    }

    function limparTudo() {
      if (confirm('Tem certeza que deseja apagar toda a lista?')) {
        products = [];
        saveAndRender();
      }
    }

    function formatCurrency(val) {
      return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function render() {
      productList.innerHTML = '';
      let sumA = 0;
      let sumB = 0;
      let sumBest = 0;

      if (products.length === 0) {
        productList.innerHTML = `
          <tr>
            <td colspan="5" class="text-center py-8 text-slate-400">
              <i class="fa-solid fa-basket-shopping text-3xl mb-2 block"></i>
              Nenhum produto cadastrado na lista ainda.
            </td>
          </tr>
        `;
      } else {
        products.forEach((p) => {
          sumA += p.priceA;
          sumB += p.priceB;
          const bestPrice = Math.min(p.priceA, p.priceB);
          sumBest += bestPrice;

          const isABetter = p.priceA < p.priceB;
          const isSame = p.priceA === p.priceB;

          const row = document.createElement('tr');
          row.className = "hover:bg-slate-50 transition";
          row.innerHTML = `
            <td class="py-3 px-4 font-medium text-slate-800">${p.name}</td>
            <td class="py-3 px-4 ${isABetter ? 'font-bold text-emerald-600' : 'text-slate-600'}">${formatCurrency(p.priceA)}</td>
            <td class="py-3 px-4 ${!isABetter && !isSame ? 'font-bold text-emerald-600' : 'text-slate-600'}">${formatCurrency(p.priceB)}</td>
            <td class="py-3 px-4">
              <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${
                isSame ? 'bg-slate-100 text-slate-600' : isABetter ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-100 text-blue-700'
              }">
                ${isSame ? 'Tanto Faz' : isABetter ? 'Mercado A' : 'Mercado B'}
              </span>
            </td>
            <td class="py-3 px-4 text-right">
              <button onclick="deleteItem(${p.id})" class="text-slate-400 hover:text-red-500 p-1 transition">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          `;
          productList.appendChild(row);
        });
      }

      document.getElementById('totalA').innerText = formatCurrency(sumA);
      document.getElementById('totalB').innerText = formatCurrency(sumB);
      document.getElementById('bestTotal').innerText = formatCurrency(sumBest);
      document.getElementById('itemCount').innerText = products.length;

      const maxTotal = Math.max(sumA, sumB);
      const economy = maxTotal - sumBest;
      document.getElementById('savingsText').innerText = economy > 0 
        ? `Você economiza até ${formatCurrency(economy)} comparado ao mercado mais caro!` 
        : 'Adicione produtos para ver o cálculo de economia.';
    }

    // Inicializa a tela com os itens do localStorage
    render();
  </script>
</body>
</html>
